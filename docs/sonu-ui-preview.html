<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>Son U UI preview</title>
<style>
  body{font-family:system-ui;background:#080b10;color:#e8eef5;padding:2rem;}
  .sonu-gold-box{border:1px solid rgba(251,191,36,.45);border-radius:16px;padding:1rem;background:linear-gradient(145deg,rgba(251,191,36,.14),rgba(18,24,32,.92);max-width:520px;}
  .kicker{color:#fbbf24;font-size:.7rem;font-weight:700;letter-spacing:.08em;}
  .banner-live{color:#ff6b6b;border:2px solid rgba(248,113,113,.55);background:rgba(248,113,113,.12);display:inline-block;padding:.35rem 1rem;font-size:1.35rem;font-weight:800;margin:.5rem 0;}
  .banner-paper{color:#93c5fd;border:2px solid rgba(147,197,253,.35);background:rgba(96,165,250,.08);display:inline-block;padding:.35rem 1rem;font-size:1.35rem;font-weight:800;margin:.5rem 0;}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .85rem;border-radius:10px;border:1px solid #2a3340;margin-right:.4rem;background:#0c1018;}
  .lamp{width:.55rem;height:.55rem;border-radius:50%;display:inline-block;}
  .green{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.2);}
  .yellow{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.18);}
  h2{margin-top:2rem;font-size:1rem;color:#8b98a8;}
</style></head>
<body>
  <h1>Desk · Live · Son U — UI preview（PR）</h1>
  <p>Production: tab「Live · Son U」金框 + 分開 Live/Paper log。</p>
  <div class="sonu-gold-box">
    <div class="kicker">DESK · 15M BTC+ETH</div>
    <strong>Live · Son U</strong>
    <div class="banner-live">LIVE</div>
    <div>
      <span class="btn"><span class="lamp green"></span> Live 實盤</span>
      <span class="btn"><span class="lamp yellow"></span> Paper 模擬</span>
    </div>
    <p style="color:#8b98a8;font-size:.85rem;margin-top:.75rem">Combined PnL · WR · stake ref · 後端 armed</p>
  </div>
  <h2>Paper 模式</h2>
  <div class="sonu-gold-box">
    <div class="banner-paper">PAPER</div>
    <div>
      <span class="btn"><span class="lamp yellow"></span> Live 實盤</span>
      <span class="btn"><span class="lamp green"></span> Paper 模擬</span>
    </div>
  </div>
  <h2>Logs</h2>
  <p>Tabs: <strong>Live log</strong> | <strong>Paper log</strong> — Paper skipped 預設收起。</p>
</body></html>
