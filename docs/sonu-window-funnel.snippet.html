<div class="sonu-funnel-kicker">窗口漏斗 · 本 session</div>
<div class="sonu-window-funnel" id="c15m-window-funnel" aria-label="窗口考慮／過濾／入場" aria-live="polite">
  <div class="metric-mini win-considered">
    <div class="label">考慮</div>
    <div class="value" id="c15m-win-considered">—</div>
    <div class="hint">窗</div>
  </div>
  <div class="metric-mini win-filtered">
    <div class="label">過濾</div>
    <div class="value" id="c15m-win-filtered">—</div>
    <div class="hint">skip</div>
  </div>
  <div class="metric-mini win-entered">
    <div class="label">入場</div>
    <div class="value" id="c15m-win-entered">—</div>
    <div class="hint">落單</div>
  </div>
</div>
<div class="sonu-window-funnel-hint" id="c15m-window-funnel-hint">考慮 — · 過濾 — · 入場 —</div>
